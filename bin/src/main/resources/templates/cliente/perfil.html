<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Mi Perfil - TuSuperJK</title>
	<style>
		.profile-card {
			background: white;
			border: 3px solid var(--black);
			padding: 3rem;
			box-shadow: 12px 12px 0 var(--black);
			max-width: 600px;
			margin: 0 auto;
		}

		.profile-header {
			text-align: center;
			margin-bottom: 2rem;
		}

		.profile-avatar {
			width: 100px;
			height: 100px;
			border-radius: 50%;
			border: 3px solid var(--black);
			background: var(--pastel-lavender);
			display: flex;
			align-items: center;
			justify-content: center;
			font-size: 2.5rem;
			margin: 0 auto 1rem;
		}

		.profile-info {
			display: grid;
			gap: 1.5rem;
		}

		.info-group {
			display: grid;
			grid-template-columns: 1fr 2fr;
			align-items: center;
			gap: 1rem;
		}

		.info-label {
			font-weight: 700;
			color: var(--black);
			text-transform: uppercase;
			letter-spacing: 0.05em;
			font-size: 0.9rem;
		}

		.info-value {
			padding: 0.75rem 1rem;
			border: 2px solid var(--black);
			background: var(--pastel-cream);
			font-weight: 500;
		}

		.btn-edit {
			background: var(--pastel-blue);
			border: 2px solid var(--black);
			padding: 1rem 2rem;
			font-weight: 700;
			cursor: pointer;
			transition: all 0.2s ease;
			width: 100%;
			margin-top: 1rem;
		}

		.btn-edit:hover {
			transform: translate(-2px, -2px);
			box-shadow: 4px 4px 0 var(--black);
		}
	</style>
</head>

<body>
	<nav class="navbar">
		<div class="brand">👤 TuSuperJK - Mi Perfil</div>
		<div class="user-info">
			<div class="user-badge">
				👋 Hola, <span th:text="${user.firstName}"></span>
			</div>
			<form th:action="@{/logout}" method="post">
				<button type="submit" class="logout-btn">🚪 Cerrar Sesión</button>
			</form>
		</div>
	</nav>

	<div class="container">
		<a th:href="@{/cliente/dashboard}" class="back-btn">← Volver al Dashboard</a>
		<h1 class="page-title">Mi Perfil</h1>

		<div class="profile-card">
			<div class="profile-header">
				<div class="profile-avatar">
					<span th:text="${user.firstName.substring(0,1) + user.lastName.substring(0,1)}"></span>
				</div>
				<h2 th:text="${user.firstName + ' ' + user.lastName}"></h2>
				<p th:text="'Cliente desde: ' + ${#temporals.format(user.createdAt, 'dd/MM/yyyy')}"></p>
			</div>

			<div class="profile-info">
				<div class="info-group">
					<div class="info-label">Nombre</div>
					<div class="info-value" th:text="${user.firstName}"></div>
				</div>

				<div class="info-group">
					<div class="info-label">Apellido</div>
					<div class="info-value" th:text="${user.lastName}"></div>
				</div>

				<div class="info-group">
					<div class="info-label">Email</div>
					<div class="info-value" th:text="${user.email}"></div>
				</div>

				<div class="info-group">
					<div class="info-label">Rol</div>
					<div class="info-value" th:text="${user.role}"></div>
				</div>

				<div class="info-group">
					<div class="info-label">Estado</div>
					<div class="info-value" th:text="${user.enabled ? 'Activo' : 'Inactivo'}"></div>
				</div>
			</div>

			<button class="btn-edit">✏️ Editar Perfil</button>
		</div>
	</div>
</body>

</html>
